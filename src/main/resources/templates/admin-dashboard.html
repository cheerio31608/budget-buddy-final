<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Budget Buddy Admin</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #f7f8fa; color: #20242a; }
        main { max-width: 1040px; margin: 0 auto; padding: 32px 20px; }
        h1 { margin: 0 0 24px; font-size: 28px; }
        .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; }
        .metric, table { background: white; border: 1px solid #dde1e7; border-radius: 8px; }
        .metric { padding: 16px; }
        .label { color: #667085; font-size: 13px; }
        .value { margin-top: 8px; font-size: 28px; font-weight: 700; }
        table { width: 100%; border-collapse: collapse; overflow: hidden; }
        th, td { padding: 12px; border-bottom: 1px solid #eef1f4; text-align: left; font-size: 14px; }
        th { color: #667085; background: #fbfcfd; }
        @media (max-width: 720px) { .metrics { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<main>
    <h1>Budget Buddy Admin</h1>
    <section class="metrics">
        <div class="metric"><div class="label">Users</div><div class="value" th:text="${userCount}">0</div></div>
        <div class="metric"><div class="label">Transactions</div><div class="value" th:text="${transactionCount}">0</div></div>
        <div class="metric"><div class="label">AI Reports</div><div class="value" th:text="${reportCount}">0</div></div>
    </section>
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>User</th>
            <th>Type</th>
            <th>Amount</th>
            <th>Balance After</th>
            <th>At</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="transaction : ${recentTransactions}">
            <td th:text="${transaction.transactionId}">1</td>
            <td th:text="${transaction.userId}">1</td>
            <td th:text="${transaction.transactionType}">EXPENSE</td>
            <td th:text="${transaction.amount}">1000.00</td>
            <td th:text="${transaction.balanceAfter}">9000.00</td>
            <td th:text="${transaction.transactionAt}">2026-08-25T12:00</td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
